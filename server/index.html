<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">

<title>Alpine Terminal</title>

<link rel="stylesheet" href="xterm.css">

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* Modifier keyboard row */
#modifier-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    height: 42px;

    display: flex;
    gap: 4px;

    overflow-x: auto;

    background: #111;
    padding: 4px;

    box-sizing: border-box;
    z-index: 1000;
}

#modifier-bar button {
    flex: 0 0 auto;

    background: #333;
    color: white;

    border: 1px solid #555;
    border-radius: 5px;

    padding: 6px 12px;

    font-family: monospace;
    font-size: 14px;
}

/* Terminal goes below modifier bar */
#terminal {
    position: fixed;
    top: 42px;
    left: 0;
    right: 0;
    bottom: 0;

    width: 100vw;
    height: calc(100dvh - 42px);

    padding:
        env(safe-area-inset-right)
        env(safe-area-inset-left);

    box-sizing: border-box;
}

/* Hidden because we're using serial only */
#screen_container {
    display: none;
}
</style>

<script src="xterm.js"></script>
<script src="xterm-addon-fit.js"></script>
<script src="libv86.js"></script>

</head>

<body>

<div id="modifier-bar">
    <button data-key="ESC">Esc</button>
    <button data-key="CTRL">Ctrl</button>
    <button data-key="ALT">Alt</button>
    <button data-key="TAB">Tab</button>
    <button data-key="UP">↑</button>
    <button data-key="DOWN">↓</button>
    <button data-key="LEFT">←</button>
    <button data-key="RIGHT">→</button>
    <button data-key="HOME">Home</button>
    <button data-key="END">End</button>
</div>

<div id="terminal"></div>
<div id="screen_container"></div>

<script>
const term = new Terminal({
    cursorBlink: true,
    convertEol: true,
    fontFamily: "monospace",
    fontSize: 16,
    scrollback: 10000
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

term.open(document.getElementById("terminal"));
fitAddon.fit();


const emulator = new V86({
    wasm_path: "v86.wasm",

    memory_size: 128 * 1024 * 1024,
    vga_memory_size: 8 * 1024 * 1024,

    screen_container: document.getElementById("screen_container"),

    bios: {
        url: "seabios.bin"
    },

    vga_bios: {
        url: "vgabios.bin"
    },

    bzimage: {
        url: "vmlinuz-virt"
    },

    initrd: {
        url: "initramfs-virt"
    },

    cdrom: {
        url: "alpine.iso"
    },

    cmdline:
        "console=ttyS0,115200 " +
        "earlyprintk=serial,ttyS0,115200 " +
        "loglevel=7",

    net_device: {
        type: "ne2k",
        relay_url: "wss://relay.widgetry.org/"
    },

    autostart: true
});


/* Serial output */
emulator.add_listener("serial0-output-byte", function(b) {
    term.write(String.fromCharCode(b));
});


let ctrlHeld = false;
let altHeld = false;


/* Modifier buttons */
document.querySelectorAll("#modifier-bar button")
.forEach(button => {

    button.addEventListener("click", () => {

        const key = button.dataset.key;

        switch(key) {

            case "ESC":
                emulator.serial0_send("\x1b");
                break;

            case "TAB":
                emulator.serial0_send("\t");
                break;

            case "CTRL":
                ctrlHeld = !ctrlHeld;
                button.style.background =
                    ctrlHeld ? "#666" : "#333";
                break;

            case "ALT":
                altHeld = !altHeld;
                button.style.background =
                    altHeld ? "#666" : "#333";
                break;

            case "UP":
                emulator.serial0_send("\x1b[A");
                break;

            case "DOWN":
                emulator.serial0_send("\x1b[B");
                break;

            case "LEFT":
                emulator.serial0_send("\x1b[D");
                break;

            case "RIGHT":
                emulator.serial0_send("\x1b[C");
                break;

            case "HOME":
                emulator.serial0_send("\x1b[H");
                break;

            case "END":
                emulator.serial0_send("\x1b[F");
                break;
        }

        term.focus();
    });

});


/* Normal typing + Ctrl/Alt handling */
term.onData(function(data) {

    if (ctrlHeld && data.length === 1) {

        ctrlHeld = false;

        document.querySelector('[data-key="CTRL"]')
            .style.background = "#333";

        const code =
            data.toUpperCase().charCodeAt(0);

        emulator.serial0_send(
            String.fromCharCode(code & 0x1f)
        );

        return;
    }


    if (altHeld) {

        altHeld = false;

        document.querySelector('[data-key="ALT"]')
            .style.background = "#333";

        emulator.serial0_send(
            "\x1b" + data
        );

        return;
    }


    emulator.serial0_send(data);

});


function resizeTerminal()
{
    fitAddon.fit();
}

window.addEventListener("resize", resizeTerminal);

window.addEventListener("orientationchange", () => {
    setTimeout(resizeTerminal, 100);
});

window.addEventListener("focus", () => {
    term.focus();
});

term.focus();


if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
