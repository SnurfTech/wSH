<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="wSH">

<title>wSH</title>

<link rel="stylesheet" href="xterm.css">

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    position: fixed;
    inset: 0;
}

/* Extra terminal keys */
#modifier-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 4px;

    background: #111;
    padding:
        env(safe-area-inset-top)
        4px
        4px
        4px;

    box-sizing: border-box;
    z-index: 1000;
}

#modifier-bar button {
    flex: 0 0 auto;

    background: #333;
    color: white;

    border: 1px solid #555;
    border-radius: 6px;

    padding: 6px 12px;

    font-family: monospace;
    font-size: 14px;

    touch-action: manipulation;
}

/* Terminal automatically moves below keyboard bar and follows iOS viewport */
#terminal {
    position: fixed;
    left: 0;
    right: 0;

    top: calc(var(--vv-top, 0px) + var(--keyboard-height, 42px));
    height: calc(var(--vv-height, 100vh) - var(--keyboard-height, 42px));

    width: 100vw;
    box-sizing: border-box;

    padding:
        env(safe-area-inset-right)
        env(safe-area-inset-left)
        env(safe-area-inset-bottom)
        0;
}

/* Make xterm fill the terminal area */
#terminal .xterm,
#terminal .xterm-viewport,
#terminal .xterm-screen {
    height: 100%;
}

/* Hidden VGA */
#screen_container {
    display: none;
}
</style>

<script src="xterm.js"></script>
<script src="xterm-addon-fit.js"></script>
<script src="libv86.js"></script>
</head>

<body>

<div id="modifier-bar">
    <button data-key="ESC">Esc</button>
    <button data-key="CTRL">Ctrl</button>
    <button data-key="ALT">Alt</button>
    <button data-key="TAB">Tab</button>

    <button data-key="UP">↑</button>
    <button data-key="DOWN">↓</button>
    <button data-key="LEFT">←</button>
    <button data-key="RIGHT">→</button>

    <button data-key="HOME">Home</button>
    <button data-key="END">End</button>
    <button data-key="PGUP">PgUp</button>
    <button data-key="PGDN">PgDn</button>
    <button data-key="DEL">Del</button>
</div>

<div id="terminal"></div>
<div id="screen_container"></div>

<script>
const term = new Terminal({
    cursorBlink: true,
    convertEol: true,
    fontFamily: "monospace",
    fontSize: 16,
    scrollback: 10000
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

const terminalEl = document.getElementById("terminal");
const modifierBar = document.getElementById("modifier-bar");

term.open(terminalEl);

const emulator = new V86({
    wasm_path: "v86.wasm",

    memory_size: 128 * 1024 * 1024,
    vga_memory_size: 8 * 1024 * 1024,

    screen_container: document.getElementById("screen_container"),

    bios: {
        url: "seabios.bin"
    },

    vga_bios: {
        url: "vgabios.bin"
    },

    bzimage: {
        url: "vmlinuz-virt"
    },

    initrd: {
        url: "initramfs-virt"
    },

    cdrom: {
        url: "alpine.iso"
    },

    cmdline:
        "console=ttyS0,115200 " +
        "earlyprintk=serial,ttyS0,115200 " +
        "loglevel=7",

    net_device: {
        type: "ne2k",
        relay_url: "wss://relay.widgetry.org/"
    },

    autostart: true
});

/* Serial output */
emulator.add_listener("serial0-output-byte", function(b) {
    term.write(String.fromCharCode(b));
});

let ctrlHeld = false;
let altHeld = false;

/* Extra buttons */
document.querySelectorAll("#modifier-bar button").forEach(button => {
    button.addEventListener("click", () => {
        const key = button.dataset.key;

        switch (key) {
            case "ESC":
                emulator.serial0_send("\x1b");
                break;

            case "TAB":
                emulator.serial0_send("\t");
                break;

            case "CTRL":
                ctrlHeld = !ctrlHeld;
                button.style.background = ctrlHeld ? "#666" : "#333";
                break;

            case "ALT":
                altHeld = !altHeld;
                button.style.background = altHeld ? "#666" : "#333";
                break;

            case "UP":
                emulator.serial0_send("\x1b[A");
                break;

            case "DOWN":
                emulator.serial0_send("\x1b[B");
                break;

            case "LEFT":
                emulator.serial0_send("\x1b[D");
                break;

            case "RIGHT":
                emulator.serial0_send("\x1b[C");
                break;

            case "HOME":
                emulator.serial0_send("\x1b[H");
                break;

            case "END":
                emulator.serial0_send("\x1b[F");
                break;

            case "PGUP":
                emulator.serial0_send("\x1b[5~");
                break;

            case "PGDN":
                emulator.serial0_send("\x1b[6~");
                break;

            case "DEL":
                emulator.serial0_send("\x1b[3~");
                break;
        }

        term.focus();
    });
});

/* Normal typing + modifiers */
term.onData(function(data) {
    if (ctrlHeld && data.length === 1) {
        ctrlHeld = false;
        document.querySelector('[data-key="CTRL"]').style.background = "#333";

        const code = data.toUpperCase().charCodeAt(0);
        emulator.serial0_send(String.fromCharCode(code & 0x1f));
        return;
    }

    if (altHeld) {
        altHeld = false;
        document.querySelector('[data-key="ALT"]').style.background = "#333";
        emulator.serial0_send("\x1b" + data);
        return;
    }

    emulator.serial0_send(data);
});

/* Track the actual visible iOS viewport */
function syncViewport() {
    const vv = window.visualViewport;
    const top = vv ? vv.offsetTop : 0;
    const height = vv ? vv.height : window.innerHeight;

    document.documentElement.style.setProperty("--vv-top", top + "px");
    document.documentElement.style.setProperty("--vv-height", height + "px");

    fitAddon.fit();
}

/* Track modifier bar wrapping height */
function syncKeyboardHeight() {
    document.documentElement.style.setProperty(
        "--keyboard-height",
        modifierBar.offsetHeight + "px"
    );

    fitAddon.fit();
}

const barObserver = new ResizeObserver(() => {
    syncKeyboardHeight();
    syncViewport();
});
barObserver.observe(modifierBar);

if (window.visualViewport) {
    visualViewport.addEventListener("resize", syncViewport);
    visualViewport.addEventListener("scroll", syncViewport);
}

window.addEventListener("resize", () => {
    syncKeyboardHeight();
    syncViewport();
});

window.addEventListener("orientationchange", () => {
    setTimeout(() => {
        syncKeyboardHeight();
        syncViewport();
    }, 100);
});

window.addEventListener("focus", () => {
    term.focus();
});

syncKeyboardHeight();
syncViewport();
term.focus();

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
