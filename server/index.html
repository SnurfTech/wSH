<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="wSH">

<title>wSH</title>

<link rel="stylesheet" href="xterm.css">

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    position: fixed;
    inset: 0;
}

/* Extra terminal keys */
#modifier-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 4px;

    background: #111;
    padding:
        env(safe-area-inset-top)
        4px
        4px
        4px;

    box-sizing: border-box;
    z-index: 1000;
}

#modifier-bar button {
    flex: 0 0 auto;

    background: #333;
    color: white;

    border: 1px solid #555;
    border-radius: 6px;

    padding: 6px 12px;

    font-family: monospace;
    font-size: 14px;

    touch-action: manipulation;
}

/* Terminal automatically moves below keyboard bar and follows iOS viewport */
#terminal {
    position: fixed;
    left: 0;
    right: 0;

    top: calc(var(--vv-top, 0px) + var(--keyboard-height, 42px));
    height: calc(var(--vv-height, 100vh) - var(--keyboard-height, 42px));

    width: 100vw;
    box-sizing: border-box;

    padding:
        env(safe-area-inset-right)
        env(safe-area-inset-left)
        env(safe-area-inset-bottom)
        0;
}

/* Make xterm fill the terminal area */
#terminal .xterm,
#terminal .xterm-viewport,
#terminal .xterm-screen {
    height: 100%;
}

/* Hidden VGA */
#screen_container {
    display: none;
}
</style>

<script src="xterm.js"></script>
<script src="xterm-addon-fit.js"></script>
<script src="libv86.js"></script>
</head>

<body>

<div id="modifier-bar">
    <button data-key="SAVE">Save</button>
    <button data-key="ESC">Esc</button>
    <button data-key="CTRL">Ctrl</button>
    <button data-key="ALT">Alt</button>
    <button data-key="TAB">Tab</button>

    <button data-key="UP">↑</button>
    <button data-key="DOWN">↓</button>
    <button data-key="LEFT">←</button>
    <button data-key="RIGHT">→</button>

    <button data-key="HOME">Home</button>
    <button data-key="END">End</button>
    <button data-key="PGUP">PgUp</button>
    <button data-key="PGDN">PgDn</button>
    <button data-key="DEL">Del</button>
</div>

<div id="terminal"></div>
<div id="save-overlay"
style="
position:fixed;
left:0;
top:0;
right:0;
bottom:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.45);
backdrop-filter:blur(4px);
z-index:100000;
touch-action:none;
pointer-events:all;
user-select:none;
">

<div style="
padding:30px;
border-radius:12px;
background:rgba(30,30,30,.85);
font-size:28px;
color:white;
font-family:sans-serif;
">
Saving...
</div>

</div>
<div id="screen_container"></div>

<script>
(async () => {

if (navigator.storage?.persist) {
    const granted = await navigator.storage.persist();
    console.log("Persistent storage:", granted);
}

async function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open("wSH", 1);

        req.onupgradeneeded = () => {
            req.result.createObjectStore("data");
        };

        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function loadSavedDisk() {
    const db = await openDB();

    const tx = db.transaction("data");
    const store = tx.objectStore("data");

    const count = await new Promise((resolve, reject) => {
        const r = store.get("disk-count");
        r.onsuccess = () => resolve(r.result ?? null);
        r.onerror = () => reject(r.error);
    });

    if (count === null) return null;

    const parts = [];

    for (let i = 0; i < count; i++) {
        const chunk = await new Promise((resolve, reject) => {
            const r = store.get("disk-" + i);
            r.onsuccess = () => resolve(r.result);
            r.onerror = () => reject(r.error);
        });

        parts.push(chunk);
    }

    return await new Blob(parts).arrayBuffer();
}

const CHUNK_SIZE = 100 * 1024 * 1024;

async function saveDisk() {
    const src = emulator.v86.cpu.devices.ide.primary.master.buffer.buffer;

    const db = await openDB();
    const tx = db.transaction("data", "readwrite");
    const store = tx.objectStore("data");

    const oldCount = await new Promise((resolve, reject) => {
        const r = store.get("disk-count");
        r.onsuccess = () => resolve(r.result ?? 0);
        r.onerror = () => reject(r.error);
    });

    for(let i = 0; i < oldCount; i++) {
        store.delete("disk-" + i);
    }

    const count = Math.ceil(src.byteLength / CHUNK_SIZE);

    store.put(count, "disk-count");

    for(let i = 0; i < count; i++) {
        const start = i * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, src.byteLength);

        const chunk = src.slice(start, end);

        store.put(chunk, "disk-" + i);
    }

    return new Promise((resolve, reject) => {
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
    });
}

function waitForSaveSync()
{
    return new Promise(resolve =>
    {
        let buffer = "";

        saveWaiter = function(ch)
        {
            buffer += ch;

            if(buffer.includes("__SAVE_DONE__"))
            {
                saveWaiter = null;
                resolve();
            }

            if(buffer.length > 200)
            {
                buffer = buffer.slice(-200);
            }
        };
    });
}

async function flushFilesystem()
{
    serial1_send("sync && echo __SAVE_DONE__\n");

    await waitForSaveSync();
}

async function loadSplitDisk(prefix, parts) {
    const blobs = [];

    for (const suffix of parts) {
        const response = await fetch(prefix + suffix);

        if (!response.ok) {
            throw new Error(`Failed to fetch ${prefix + suffix}`);
        }

        blobs.push(await response.blob());
    }

    return await new Blob(blobs).arrayBuffer();
}

const count = 52; // number of parts

const parts = Array.from(
    { length: count },
    (_, i) => i.toString().padStart(3, "0")
);

let disk = await loadSavedDisk();

if (!disk) {
    console.log("Loading base disk...");
    disk = await loadSplitDisk("alpine.img.part.", parts);
} else {
    console.log("Loaded disk from IndexedDB.");
}

const initramfsCount = 2; // change as needed

const initramfsParts = Array.from(
    { length: initramfsCount },
    (_, i) => i.toString().padStart(3, "0")
);

const initrd = await loadSplitDisk(
    "initramfs-virt.part.",
    initramfsParts
);

window.loadSavedDisk = loadSavedDisk;
window.openDB = openDB;

const term = new Terminal({
    cursorBlink: true,
    convertEol: true,
    fontFamily: "monospace",
    fontSize: 16,
    scrollback: 10000
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

const terminalEl = document.getElementById("terminal");
const modifierBar = document.getElementById("modifier-bar");

term.open(terminalEl);

const emulator = new V86({
    wasm_path: "v86.wasm",

    memory_size: 128 * 1024 * 1024,
    vga_memory_size: 8 * 1024 * 1024,

    screen_container: document.getElementById("screen_container"),

    bios: {
        url: "seabios.bin"
    },

    vga_bios: {
        url: "vgabios.bin"
    },

    bzimage: {
        url: "vmlinuz-virt"
    },

    initrd: {
        buffer: initrd
    },

    hda: {
        buffer: disk
    },

    cmdline:
        "rw console=ttyS0,115200 " +
        "earlyprintk=serial,ttyS0,115200 " +
        "loglevel=7 root=/dev/sda",

    net_device: {
        type: "ne2k",
        relay_url: "wss://relay.widgetry.org/"
    },

    autostart: true,
    uart1: true
});

window.emulator = emulator;
window.saveDisk = saveDisk;

window.serial1_send = function(data) {
    const bus = emulator.v86.cpu.devices.uart1.bus.pair;

    for (const c of data) {
        bus.send("serial1-input", c.charCodeAt(0));
    }
};

const saveOverlay = document.getElementById("save-overlay");

function showSaveOverlay() {
    saveOverlay.style.display = "flex";
}

function hideSaveOverlay() {
    saveOverlay.style.display = "none";
}

/* Main terminal output (ttyS0) */
emulator.add_listener("serial0-output-byte", function(b) {
    term.write(String.fromCharCode(b));
});


/* Save/control serial output (ttyS1) */
emulator.add_listener("serial1-output-byte", function(b) {
    console.log("SERIAL1:", String.fromCharCode(b));
});

let saveWaiter = null;

emulator.add_listener("serial1-output-byte", function(b) {

    const c = String.fromCharCode(b);

    if(saveWaiter)
    {
        saveWaiter(c);
    }

});

let ctrlHeld = false;
let altHeld = false;
let saveInProgress = false;

/* Extra buttons */
document.querySelectorAll("#modifier-bar button").forEach(button => {
    button.addEventListener("click", () => {
        const key = button.dataset.key;

        switch (key) {
            case "SAVE":

                (async () => {

                    // ADD THESE LINES HERE
                    if (saveInProgress)
                        return;

                    saveInProgress = true;

                    button.disabled = true;

                    showSaveOverlay();

                    try {
                        button.textContent = "Syncing...";

                        await flushFilesystem();
                        await new Promise(r => setTimeout(r, 100));

                        button.textContent = "Saving...";

                        emulator.stop();

                        try {
                            await saveDisk();
                        } finally {
                            emulator.run();
                        }

                        button.textContent = "Saved!";
                    }
                    catch (e) {
                        console.error(e);
                        button.textContent = "Failed";
                    }
                    finally {
                        // ALSO MOVE THIS HERE
                        saveInProgress = false;

                        hideSaveOverlay();

                        setTimeout(() => {
                            button.disabled = false;
                            button.textContent = "Save";
                        }, 1000);
                    }

                })();

                break;
                
            case "ESC":
                emulator.serial0_send("\x1b");
                break;

            case "TAB":
                emulator.serial0_send("\t");
                break;

            case "CTRL":
                ctrlHeld = !ctrlHeld;
                button.style.background = ctrlHeld ? "#666" : "#333";
                break;

            case "ALT":
                altHeld = !altHeld;
                button.style.background = altHeld ? "#666" : "#333";
                break;

            case "UP":
                emulator.serial0_send("\x1b[A");
                break;

            case "DOWN":
                emulator.serial0_send("\x1b[B");
                break;

            case "LEFT":
                emulator.serial0_send("\x1b[D");
                break;

            case "RIGHT":
                emulator.serial0_send("\x1b[C");
                break;

            case "HOME":
                emulator.serial0_send("\x1b[H");
                break;

            case "END":
                emulator.serial0_send("\x1b[F");
                break;

            case "PGUP":
                emulator.serial0_send("\x1b[5~");
                break;

            case "PGDN":
                emulator.serial0_send("\x1b[6~");
                break;

            case "DEL":
                emulator.serial0_send("\x1b[3~");
                break;
        }

        term.focus();
    });
});

/* Normal typing + modifiers */
term.onData(function(data) {
    if (ctrlHeld && data.length === 1) {
        ctrlHeld = false;
        document.querySelector('[data-key="CTRL"]').style.background = "#333";

        const code = data.toUpperCase().charCodeAt(0);
        emulator.serial0_send(String.fromCharCode(code & 0x1f));
        return;
    }

    if (altHeld) {
        altHeld = false;
        document.querySelector('[data-key="ALT"]').style.background = "#333";
        emulator.serial0_send("\x1b" + data);
        return;
    }

    emulator.serial0_send(data);
});

/* Track the actual visible iOS viewport */
function syncViewport() {
    const vv = window.visualViewport;
    const top = vv ? vv.offsetTop : 0;
    const height = vv ? vv.height : window.innerHeight;

    document.documentElement.style.setProperty("--vv-top", top + "px");
    document.documentElement.style.setProperty("--vv-height", height + "px");

    fitAddon.fit();
}

/* Track modifier bar wrapping height */
function syncKeyboardHeight() {
    document.documentElement.style.setProperty(
        "--keyboard-height",
        modifierBar.offsetHeight + "px"
    );

    fitAddon.fit();
}

const barObserver = new ResizeObserver(() => {
    syncKeyboardHeight();
    syncViewport();
});
barObserver.observe(modifierBar);

if (window.visualViewport) {
    visualViewport.addEventListener("resize", syncViewport);
    visualViewport.addEventListener("scroll", syncViewport);
}

window.addEventListener("resize", () => {
    syncKeyboardHeight();
    syncViewport();
});

window.addEventListener("orientationchange", () => {
    setTimeout(() => {
        syncKeyboardHeight();
        syncViewport();
    }, 100);
});

window.addEventListener("focus", () => {
    term.focus();
});

syncKeyboardHeight();
syncViewport();
term.focus();

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
})();
</script>

</body>
</html>
