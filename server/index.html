<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">

<title>Alpine Terminal</title>

<link rel="stylesheet" href="xterm.css">

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#terminal {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100dvh;
    padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    box-sizing: border-box;
}

/* Hidden because we're using serial only */
#screen_container {
    display: none;
}
</style>

<script src="xterm.js"></script>
<script src="xterm-addon-fit.js"></script>

<script src="libv86.js"></script>
</head>

<body>

<div id="terminal"></div>
<div id="screen_container"></div>

<script>
const term = new Terminal({
    cursorBlink: true,
    convertEol: true,
    fontFamily: "monospace",
    fontSize: 16,
    scrollback: 10000
});

const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);

term.open(document.getElementById("terminal"));
fitAddon.fit();

const emulator = new V86({
    wasm_path: "v86.wasm",

    memory_size: 128 * 1024 * 1024,
    vga_memory_size: 8 * 1024 * 1024,

    // Hidden
    screen_container: document.getElementById("screen_container"),

    bios: {
        url: "seabios.bin"
    },

    vga_bios: {
        url: "vgabios.bin"
    },

    bzimage: {
        url: "vmlinuz-virt"
    },

    initrd: {
        url: "initramfs-virt"
    },

    cdrom: {
        url: "alpine.iso"
    },

    cmdline:
        "console=ttyS0,115200 " +
        "earlyprintk=serial,ttyS0,115200 " +
        "loglevel=7",

    net_device: {
        type: "ne2k",
        relay_url: "wss://relay.widgetry.org/"
    },

    autostart: true
});

// Receive serial data
function writeByte(b)
{
    term.write(String.fromCharCode(b));
}

if (emulator.add_listener)
{
    emulator.add_listener("serial0-output-byte", writeByte);

    emulator.add_listener("serial0-output-char", function(c)
    {
        term.write(c);
    });

    emulator.add_listener("serial0-output-line", function(line)
    {
        term.writeln(line);
    });
}

// Send keyboard input back to serial
term.onData(function(data)
{
    emulator.serial0_send(data);
});

function resizeTerminal()
{
    fitAddon.fit();
}

window.addEventListener("resize", resizeTerminal);
window.addEventListener("orientationchange", function()
{
    setTimeout(resizeTerminal, 100);
});

window.addEventListener("focus", function()
{
    term.focus();
});

term.focus();

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
