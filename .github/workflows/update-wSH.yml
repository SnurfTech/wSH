name: Update wSH
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Dependencies
      run: |
        sudo apt update
        sudo apt install gcc-i686-linux-gnu make bc flex bison libelf-dev libssl-dev dwarves jq build-essential bison cpio rsync xz-utils wget -y

    - name: Build Stuff
      run: |
        export XTERM_ADDON_FIT_VERSION="0.8.0"
        export XTERM_VERSION="5.3.0"
        export ALPINEROOTFS="https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86/alpine-minirootfs-3.24.1-x86.tar.gz"
        export APKSTATIC="https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v2.14.6/x86_64/apk.static"
        export ALPINEREPO="https://dl-cdn.alpinelinux.org/alpine/v3.24/main"
        export BUSYBOX="https://busybox.net/downloads/binaries/1.35.0-i686-linux-musl/busybox"

        mkdir wSH
        cd wSH
        wget https://github.com/copy/v86/releases/download/latest/libv86.js
        wget https://github.com/copy/v86/releases/download/latest/v86.wasm
        wget https://cdn.jsdelivr.net/npm/xterm-addon-fit@$XTERM_ADDON_FIT_VERSION/lib/xterm-addon-fit.js
        wget https://cdn.jsdelivr.net/npm/xterm@$XTERM_VERSION/lib/xterm.js
        wget https://cdn.jsdelivr.net/npm/xterm@$XTERM_VERSION/css/xterm.css
        wget https://github.com/copy/v86/raw/refs/heads/master/bios/vgabios.bin
        git clone https://github.com/qemu/seabios
        cd seabios
        make defconfig
        cat << EOF >> .config
        # Option A: Debug Logging Configuration
        CONFIG_DEBUG_LEVEL=8
        CONFIG_DEBUG_SERIAL=y
        CONFIG_DEBUG_SERIAL_PORT=0x3f8

        # Option B: Interactive Serial Console (Sercon)
        CONFIG_SERCON=y
        EOF
        make olddefconfig
        make -j$(nproc)
        mv out/bios.bin ../seabios.bin
        cd ..
        mkdir rootfs
        wget $ALPINEROOTFS -O alpine.tar.gz
        sudo tar -p --same-owner -P --acls --xattrs -xzvf alpine.tar.gz -C rootfs
        cat << "EOF" | sudo tee rootfs/etc/fstab
        /dev/sda / ext4 defaults 1 1
        EOF
        cat << "EOF" | sudo tee -a rootfs/etc/inittab
        ttyS0::respawn:/sbin/agetty -a root -n -L ttyS0 115200 vt100
        ttyS1::respawn:/sbin/agetty -a root -n -L ttyS1 115200 vt100
        EOF
        cat << "EOF" | sudo tee rootfs/etc/motd
        Welcome to wSH!
        You can change this message at any time by editing /etc/motd.
        
        EOF
        wget $APKSTATIC
        chmod +x apk.static
        sudo ./apk.static --root rootfs --initdb --arch x86 --repository $ALPINEREPO --allow-untrusted add openrc mdevd-openrc agetty vim nano wget curl bash build-base ca-certificates sudo util-linux alpine-conf e2fsprogs
        sudo ln -s /etc/init.d/mdevd rootfs/etc/runlevels/sysinit/mdevd
        sudo ln -s /etc/init.d/mdevd-init rootfs/etc/runlevels/sysinit/mdevd-init
        sudo ln -s /etc/init.d/hostname rootfs/etc/runlevels/boot/hostname
        cat << "EOF" | sudo tee rootfs/etc/local.d/startup.start
        #!/bin/sh
        /sbin/syslogd
        EOF
        sudo chmod +x rootfs/etc/local.d/startup.start
        sudo ln -s /etc/init.d/local rootfs/etc/runlevels/default/local
        #setup wifi
        cat << EOF | sudo tee rootfs/etc/network/interfaces
        auto lo
        iface lo inet loopback

        auto eth0
        iface eth0 inet dhcp
        EOF
        sudo ln -s /etc/init.d/networking rootfs/etc/runlevels/default/networking
        sudo sed -i 's/mdevd-coldplug -O4/mdevd-coldplug/' rootfs/etc/init.d/mdevd-init
        sudo dd if=/dev/zero of=alpine.img bs=1M count=1024
        sudo mkfs.ext4 alpine.img
        mkdir /tmp/hda-mount
        sudo mount -o loop alpine.img /tmp/hda-mount
        sudo cp -a rootfs/. /tmp/hda-mount/
        sudo umount /tmp/hda-mount
        rmdir /tmp/hda-mount
        split -b 100M --numeric-suffixes=0 --suffix-length=3 alpine.img alpine.img.part.

        mkdir -p initramfs/{bin,dev,etc,proc,sys,newroot}
        cd initramfs

        wget $BUSYBOX -O bin/busybox
        chmod +x bin/busybox
        ./bin/busybox --install bin

        cat << "EOF" > init
        #!/bin/busybox sh

        export PATH="/bin"

        # 1. Mount essential virtual filesystems
        mount -t proc proc /proc
        mount -t sysfs sysfs /sys
        mount -t devtmpfs devtmpfs /dev 2>/dev/null || mount -t tmpfs tmpfs /dev

        echo "=== Initramfs Booting ==="

        echo "=== Loading /etc/modules ==="

        if [ -f /etc/modules ]; then
            while read -r line || [ -n "$line" ]; do
                case "$line" in
                    ""|\#*) continue ;; # Skip empty lines and comments
                esac

                # Run modprobe with the full line (unquoted to allow arguments to separate)
                modprobe $line
            done < /etc/modules
        fi

        echo "=== Finished /etc/modules ==="

        # 3. Mount /dev/sda as read-write (rw)

        echo "Mounting /dev/sda..."
        if ! mount -t ext4 -o rw /dev/sda /newroot; then
            echo "ERROR: Failed to mount /dev/sda in read-write mode."
            echo "Starting emergency shell..."
            exec /bin/sh
        fi

        # 4. Move virtual filesystems to the new root target
        mount -o move /proc /newroot/proc
        mount -o move /sys /newroot/sys
        mount -o move /dev /newroot/dev

        # 5. Hand over control to the main OS init
        echo "Switching root to /dev/sda..."
        exec switch_root /newroot /sbin/init

        # Emergency fallback
        echo "ERROR: Unable to execute init process in /dev/sda."
        exec /bin/sh
        EOF
        chmod +x init
        cat << EOF > etc/modules
        ne2k-pci
        EOF
        cd ..

        mkdir kernel
        cd kernel

        curl -s "https://api.github.com/repos/alpinelinux/aports/contents/main/linux-lts" | jq -r '.[] | .download_url' | xargs -n1 wget

        export PKGVER="$(cat APKBUILD | grep -oP "pkgver=.*" | cut -d '=' -f2)"
        export KERNVER=${PKGVER%.*}
        export LINUXSRC="https://cdn.kernel.org/pub/linux/kernel/v${PKGVER%%.*}.x/linux-$KERNVER.tar.xz"
        export LINUXPATCH="https://cdn.kernel.org/pub/linux/kernel/v${PKGVER%%.*}.x/patch-$PKGVER.xz"
        wget $LINUXSRC
        wget $LINUXPATCH
        tar -xvf linux-$KERNVER.tar.xz
        cd linux-$KERNVER
        xzcat ../patch-$PKGVER.xz | patch -p1
        for patch in ../*.patch; do
          patch -p1 < $patch
        done

        make allnoconfig

        for opt in \
            X86 X86_32 MMU \
            BINFMT_ELF BINFMT_SCRIPT \
            PRINTK BUG \
            BLK_DEV_INITRD \
            PCI \
            BLOCK \
            ATA ATA_PIIX \
            SCSI BLK_DEV_SD \
            EXT4_FS JBD2 FS_MBCACHE \
            INET \
            TTY SERIAL_8250 SERIAL_8250_CONSOLE \
            PROC_FS SYSFS DEVTMPFS DEVTMPFS_MOUNT TMPFS \
            NET PACKET UNIX NETDEVICES NET_CORE LOOPBACK ETHERNET NET_VENDOR_8390 \
            COMPAT_32BIT_TIME \
            CMDLINE \
            MODULES; do
            scripts/config --enable "$opt"
        done
        for opt in \
            LIB8390 \
            NE2K_PCI; do
            scripts/config --module "$opt"
        done

        make olddefconfig

        echo "SEEING CONFIG STUFF"
        echo "------------------------------"
        cat .config
        echo "------------------------------"
        
        make -j$(nproc) bzImage modules

        make modules_install INSTALL_MOD_PATH=../../initramfs

        depmod -a -b ../../initramfs "$(make -s kernelrelease)"

        cp arch/x86/boot/bzImage ../../vmlinuz-virt

        cd ../../initramfs

        find . -print0 | sudo cpio --null -ov --format=newc > ../initramfs-virt

    - name: Create bundled.html
      run: |
        cd wSH
        cat << "EOF" > index.html
        <!DOCTYPE html>
        <html lang="en">
        <head>
        <meta charset="UTF-8">
        <meta
          name="viewport"
          content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="wSH">

        <title>wSH</title>

        <link rel="stylesheet" href="xterm.css">

        <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            position: fixed;
            inset: 0;
        }

        /* Extra terminal keys */
        #modifier-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 4px;

            background: #111;
            padding:
                env(safe-area-inset-top)
                4px
                4px
                4px;

            box-sizing: border-box;
            z-index: 1000;
        }

        #modifier-bar button {
            flex: 0 0 auto;

            background: #333;
            color: white;

            border: 1px solid #555;
            border-radius: 6px;

            padding: 6px 12px;

            font-family: monospace;
            font-size: 14px;

            touch-action: manipulation;
        }

        /* Terminal automatically moves below keyboard bar and follows iOS viewport */
        #terminal {
            position: fixed;
            left: 0;
            right: 0;

            top: calc(var(--vv-top, 0px) + var(--keyboard-height, 42px));
            height: calc(var(--vv-height, 100vh) - var(--keyboard-height, 42px));

            width: 100vw;
            box-sizing: border-box;

            padding:
                env(safe-area-inset-right)
                env(safe-area-inset-left)
                env(safe-area-inset-bottom)
                0;
        }

        /* Make xterm fill the terminal area */
        #terminal .xterm,
        #terminal .xterm-viewport,
        #terminal .xterm-screen {
            height: 100%;
        }

        /* Hidden VGA */
        #screen_container {
            display: none;
        }
        </style>

        <script src="xterm.js"></script>
        <script src="xterm-addon-fit.js"></script>
        <script src="libv86.js"></script>
        </head>

        <body>

        <div id="modifier-bar">
            <button data-key="SAVE">Save</button>
            <button data-key="ESC">Esc</button>
            <button data-key="CTRL">Ctrl</button>
            <button data-key="ALT">Alt</button>
            <button data-key="TAB">Tab</button>

            <button data-key="UP">↑</button>
            <button data-key="DOWN">↓</button>
            <button data-key="LEFT">←</button>
            <button data-key="RIGHT">→</button>

            <button data-key="HOME">Home</button>
            <button data-key="END">End</button>
            <button data-key="PGUP">PgUp</button>
            <button data-key="PGDN">PgDn</button>
            <button data-key="DEL">Del</button>
        </div>

        <div id="terminal"></div>
        <div id="save-overlay"
        style="
        position:fixed;
        left:0;
        top:0;
        right:0;
        bottom:0;
        display:flex;
        justify-content:center;
        align-items:center;
        background:rgba(0,0,0,.85);
        backdrop-filter:blur(4px);
        z-index:100000;
        touch-action:none;
        pointer-events:all;
        user-select:none;
        ">

        <div style="
        padding:30px;
        border-radius:12px;
        background:rgba(30,30,30,.85);
        font-size:28px;
        color:white;
        font-family:sans-serif;
        text-align:center;
        ">
        <div id="overlay-title">Loading...</div>
        <div id="overlay-status" style="
            margin-top:10px;
            font-size:16px;
            opacity:.7;
        ">
            Preparing...
        </div>
        </div>

        </div>
        <div id="screen_container"></div>

        <script>
        (async () => {

        if (navigator.storage?.persist) {
            const granted = await navigator.storage.persist();
            console.log("Persistent storage:", granted);
        }

        async function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open("wSH", 1);

                req.onupgradeneeded = () => {
                    req.result.createObjectStore("data");
                };

                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function loadSplitDisk(prefix, parts) {
            const blobs = [];

            for (const suffix of parts) {
                const url = prefix + suffix;

                let response = null;
                let lastError = null;

                for (let attempt = 1; attempt <= 3; attempt++) {
                    try {
                        console.log(`Fetching ${suffix} (attempt ${attempt}/3)`);

                        response = await fetch(url, {
                            cache: "no-cache"
                        });

                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}`);
                        }

                        const blob = await response.blob();

                        console.log(
                            `Loaded ${suffix}: ${(blob.size / 1024 / 1024).toFixed(2)} MB`
                        );

                        blobs.push(blob);

                        // Successfully loaded this part.
                        lastError = null;
                        break;

                    } catch (e) {
                        lastError = e;
                        console.warn(
                            `Failed to fetch ${suffix} (attempt ${attempt}/3):`,
                            e
                        );

                        if (attempt < 3) {
                            // Small delay before retrying.
                            await new Promise(resolve => setTimeout(resolve, 1000));
                        }
                    }
                }

                // All 3 attempts failed.
                if (lastError) {
                    throw new Error(
                        `Failed to fetch ${url} after 3 attempts: ${lastError}`
                    );
                }
            }

            console.log("All disk parts loaded.");

            return await new Blob(blobs).arrayBuffer();
        }

        const CHUNK_SIZE = 100 * 1024 * 1024;

        async function saveDisk() {
            const src = emulator.v86.cpu.devices.ide.primary.master.buffer.buffer;

            const db = await openDB();
            const tx = db.transaction("data", "readwrite");
            const store = tx.objectStore("data");

            const oldCount = await new Promise((resolve, reject) => {
                const r = store.get("disk-count");
                r.onsuccess = () => resolve(r.result ?? 0);
                r.onerror = () => reject(r.error);
            });

            for(let i = 0; i < oldCount; i++) {
                store.delete("disk-" + i);
            }

            const count = Math.ceil(src.byteLength / CHUNK_SIZE);

            store.put(count, "disk-count");

            for(let i = 0; i < count; i++) {
                const start = i * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, src.byteLength);

                const chunk = src.slice(start, end);

                store.put(chunk, "disk-" + i);
            }

            return new Promise((resolve, reject) => {
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error);
            });
        }

        function waitForSaveSync()
        {
            return new Promise(resolve =>
            {
                let buffer = "";

                saveWaiter = function(ch)
                {
                    buffer += ch;

                    if(buffer.includes("__SAVE_DONE__"))
                    {
                        saveWaiter = null;
                        resolve();
                    }

                    if(buffer.length > 200)
                    {
                        buffer = buffer.slice(-200);
                    }
                };
            });
        }

        async function flushFilesystem()
        {
            serial1_send("sync && echo __SAVE_DONE__\n");

            await waitForSaveSync();
        }
        
        async function loadSavedDisk() {
            const db = await openDB();

            const tx = db.transaction("data");
            const store = tx.objectStore("data");

            const count = await new Promise((resolve, reject) => {
                const r = store.get("disk-count");
                r.onsuccess = () => resolve(r.result ?? null);
                r.onerror = () => reject(r.error);
            });

            if (count === null) return null;

            const parts = [];

            for (let i = 0; i < count; i++) {
                const chunk = await new Promise((resolve, reject) => {
                    const r = store.get("disk-" + i);
                    r.onsuccess = () => resolve(r.result);
                    r.onerror = () => reject(r.error);
                });

                parts.push(chunk);
            }

            return await new Blob(parts).arrayBuffer();
        }

        const saveOverlay = document.getElementById("save-overlay");

        const overlayTitle = document.getElementById("overlay-title");
        const overlayStatus = document.getElementById("overlay-status");

        function showOverlay(title, status = "") {
            overlayTitle.textContent = title;
            overlayStatus.textContent = status;
            saveOverlay.style.display = "flex";
        }

        function hideOverlay() {
            saveOverlay.style.display = "none";
        }

        function setOverlayStatus(status) {
            overlayStatus.textContent = status;
        }

        showOverlay("Preparing Disk...");

        const count = DISK_PARTS_AMOUNT; // number of parts

        const parts = Array.from(
            { length: count },
            (_, i) => i.toString().padStart(3, "0")
        );

        let disk = await loadSavedDisk();

        if (!disk) {
            console.log("Loading base disk...");
            disk = await loadSplitDisk("alpine.img.part.", parts);
        } else {
            console.log("Loaded disk from IndexedDB.");
        }

        hideOverlay();
        
        const term = new Terminal({
            cursorBlink: true,
            convertEol: true,
            fontFamily: "monospace",
            fontSize: 16,
            scrollback: 10000
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);

        const terminalEl = document.getElementById("terminal");
        const modifierBar = document.getElementById("modifier-bar");

        term.open(terminalEl);

        const emulator = new V86({
            wasm_path: "v86.wasm",

            memory_size: 128 * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,

            screen_container: document.getElementById("screen_container"),

            bios: {
                url: "seabios.bin"
            },

            vga_bios: {
                url: "vgabios.bin"
            },

            bzimage: {
                url: "vmlinuz-virt"
            },

            initrd: {
                url: "initramfs-virt"
            },

            hda: {
                buffer: disk
            },

            cmdline:
                "rw console=ttyS0,115200 " +
                "earlyprintk=serial,ttyS0,115200 " +
                "loglevel=7 root=/dev/sda",

            net_device: {
                type: "ne2k",
                relay_url: "wss://relay.widgetry.org/"
            },

            autostart: true,
            uart1: true
        });

        window.emulator = emulator;
        window.saveDisk = saveDisk;

        window.serial1_send = function(data) {
            const bus = emulator.v86.cpu.devices.uart1.bus.pair;

            for (const c of data) {
                bus.send("serial1-input", c.charCodeAt(0));
            }
        };

        /* Main terminal output (ttyS0) */
        emulator.add_listener("serial0-output-byte", function(b) {
            term.write(String.fromCharCode(b));
        });


        /* Save/control serial output (ttyS1) */
        emulator.add_listener("serial1-output-byte", function(b) {
            console.log("SERIAL1:", String.fromCharCode(b));
        });

        let saveWaiter = null;

        emulator.add_listener("serial1-output-byte", function(b) {

            const c = String.fromCharCode(b);

            if(saveWaiter)
            {
                saveWaiter(c);
            }

        });

        let ctrlHeld = false;
        let altHeld = false;
        let saveInProgress = false;

        /* Extra buttons */
        document.querySelectorAll("#modifier-bar button").forEach(button => {
            button.addEventListener("click", () => {
                const key = button.dataset.key;

                switch (key) {
                    case "SAVE":

                        (async () => {

                            // ADD THESE LINES HERE
                            if (saveInProgress)
                                return;

                            saveInProgress = true;

                            button.disabled = true;

                            showOverlay("Saving...", "Syncing filesystem...");

                            try {
                                setOverlayStatus("Syncing filesystem...");

                                await flushFilesystem();
                                await new Promise(r => setTimeout(r, 100));

                                setOverlayStatus("Saving disk...");

                                emulator.stop();

                                try {
                                    await saveDisk();
                                } finally {
                                    emulator.run();
                                }

                                button.textContent = "Saved!";
                            }
                            catch (e) {
                                console.error(e);
                                button.textContent = "Failed";
                            }
                            finally {
                                // ALSO MOVE THIS HERE
                                saveInProgress = false;

                                hideOverlay();

                                setTimeout(() => {
                                    button.disabled = false;
                                    button.textContent = "Save";
                                }, 1000);
                            }

                        })();

                        break;
                        
                    case "ESC":
                        emulator.serial0_send("\x1b");
                        break;

                    case "TAB":
                        emulator.serial0_send("\t");
                        break;

                    case "CTRL":
                        ctrlHeld = !ctrlHeld;
                        button.style.background = ctrlHeld ? "#666" : "#333";
                        break;

                    case "ALT":
                        altHeld = !altHeld;
                        button.style.background = altHeld ? "#666" : "#333";
                        break;

                    case "UP":
                        emulator.serial0_send("\x1b[A");
                        break;

                    case "DOWN":
                        emulator.serial0_send("\x1b[B");
                        break;

                    case "LEFT":
                        emulator.serial0_send("\x1b[D");
                        break;

                    case "RIGHT":
                        emulator.serial0_send("\x1b[C");
                        break;

                    case "HOME":
                        emulator.serial0_send("\x1b[H");
                        break;

                    case "END":
                        emulator.serial0_send("\x1b[F");
                        break;

                    case "PGUP":
                        emulator.serial0_send("\x1b[5~");
                        break;

                    case "PGDN":
                        emulator.serial0_send("\x1b[6~");
                        break;

                    case "DEL":
                        emulator.serial0_send("\x1b[3~");
                        break;
                }

                term.focus();
            });
        });

        /* Normal typing + modifiers */
        term.onData(function(data) {
            if (ctrlHeld && data.length === 1) {
                ctrlHeld = false;
                document.querySelector('[data-key="CTRL"]').style.background = "#333";

                const code = data.toUpperCase().charCodeAt(0);
                emulator.serial0_send(String.fromCharCode(code & 0x1f));
                return;
            }

            if (altHeld) {
                altHeld = false;
                document.querySelector('[data-key="ALT"]').style.background = "#333";
                emulator.serial0_send("\x1b" + data);
                return;
            }

            emulator.serial0_send(data);
        });

        /* Track the actual visible iOS viewport */
        function syncViewport() {
            const vv = window.visualViewport;
            const top = vv ? vv.offsetTop : 0;
            const height = vv ? vv.height : window.innerHeight;

            document.documentElement.style.setProperty("--vv-top", top + "px");
            document.documentElement.style.setProperty("--vv-height", height + "px");

            fitAddon.fit();
        }

        /* Track modifier bar wrapping height */
        function syncKeyboardHeight() {
            document.documentElement.style.setProperty(
                "--keyboard-height",
                modifierBar.offsetHeight + "px"
            );

            fitAddon.fit();
        }

        const barObserver = new ResizeObserver(() => {
            syncKeyboardHeight();
            syncViewport();
        });
        barObserver.observe(modifierBar);

        if (window.visualViewport) {
            visualViewport.addEventListener("resize", syncViewport);
            visualViewport.addEventListener("scroll", syncViewport);
        }

        window.addEventListener("resize", () => {
            syncKeyboardHeight();
            syncViewport();
        });

        window.addEventListener("orientationchange", () => {
            setTimeout(() => {
                syncKeyboardHeight();
                syncViewport();
            }, 100);
        });

        window.addEventListener("focus", () => {
            term.focus();
        });

        syncKeyboardHeight();
        syncViewport();
        term.focus();

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js");
        }
        })();
        </script>

        </body>
        </html>
        EOF
        sed -i "s|DISK_PARTS_AMOUNT|$(ls alpine.img.part.* | wc -l)|" index.html

    - name: Create Service Worker
      run: |
        cd wSH
        cat << "EOF" > sw.js
        const CACHE = "v86-offline-v1";

        const FILES = [
            "./",
            "./index.html",

            "./libv86.js",
            "./v86.wasm",

            "./seabios.bin",
            "./vgabios.bin",

            "./vmlinuz-virt",
            "./initramfs-virt",

            "./xterm.js",
            "./xterm.css",
            "./xterm-addon-fit.js"
        ];

        self.addEventListener("install", event => {
            event.waitUntil(
                caches.open(CACHE).then(cache => cache.addAll(FILES))
            );
            self.skipWaiting();
        });

        self.addEventListener("activate", event => {
            event.waitUntil(clients.claim());
        });

        self.addEventListener("fetch", event => {
            event.respondWith(
                caches.match(event.request).then(response => {
                    return response || fetch(event.request);
                })
            );
        });
        EOF

    - name: Update Icon Data
      run: |
        python -c "import base64,re; d=base64.b64encode(open('assets/appicon.png','rb').read()).decode(); f='unsigned.mobileconfig'; s=open(f,'r',encoding='utf-8').read(); s=re.sub(r'      <data>.*</data>', f'      <data>{d}</data>', s); open(f,'w',encoding='utf-8').write(s)"

    - name: Replace Old server/ Files & Do Some Git Stuff
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git rm -r --ignore-unmatch server
        git commit -m "Automated update: Erase of server/" || true
        git stash push --include-untracked -- server unsigned.mobileconfig || true
        git pull --rebase origin main
        git stash pop || true
        git push origin main

        mkdir server
        mv wSH/index.html server/
        mv wSH/*.js server/
        mv wSH/xterm.css server/
        mv wSH/alpine.img.part.* server/
        mv wSH/*-virt server/
        mv wSH/v86.wasm server/
        mv wSH/*.bin server/

    # 4. Commit and overwrite the root file
    - name: Commit
      run: |
        # Commit each file in server/ individually
        batch=0

        for file in server/* unsigned.mobileconfig; do
            [ -f "$file" ] || continue

            git add "$file"
            batch=$((batch + 1))
            if [ "$batch" -ge 5 ]; then
                if git commit -m "Automated update: $(basename "$file")"; then
                    git push origin main || {
                        git stash push --include-untracked -- server unsigned.mobileconfig || true
                        git pull --rebase origin main
                        git stash pop || true
                        git push origin main
                    }
                fi
            fi
        done

        if [ "$batch" -gt 0 ]; then
            if git commit -m "Automated update: $(basename "$file")"; then
                git push origin main || {
                    git stash push --include-untracked -- server unsigned.mobileconfig || true
                    git pull --rebase origin main
                    git stash pop || true
                    git push origin main
                }
            fi
        fi
