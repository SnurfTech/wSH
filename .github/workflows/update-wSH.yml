name: Update wSH
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create Build Folder and Set Up Dependencies
      run: |
        mkdir wSH
        cd wSH
        wget https://github.com/copy/v86/releases/download/latest/libv86.js
        wget https://github.com/copy/v86/releases/download/latest/v86.wasm
        wget https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js
        wget https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js
        wget https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css
        wget https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86/alpine-virt-3.24.1-x86.iso -O alpine.iso
        wget https://github.com/copy/v86/raw/refs/heads/master/bios/vgabios.bin
        sudo apt install p7zip -y
        7z x alpine.iso
        mv boot/vmlinuz-virt .
        mv boot/initramfs-virt .
        git clone https://github.com/qemu/seabios
        cd seabios
        make defconfig
        cat << EOF >> .config
        # Option A: Debug Logging Configuration
        CONFIG_DEBUG_LEVEL=8
        CONFIG_DEBUG_SERIAL=y
        CONFIG_DEBUG_SERIAL_PORT=0x3f8

        # Option B: Interactive Serial Console (Sercon)
        CONFIG_SERCON=y
        EOF
        make olddefconfig
        make -j$(nproc)
        mv out/bios.bin ../seabios.bin
        cd ..
        mkdir rootfs
        #cd rootfs
        #zcat ../initramfs-virt | sudo cpio -idmv
        #cd ..
        #for i in apks/x86/*.apk; do sudo tar -p --same-owner -P --acls --xattrs -xvf $i -C rootfs; done
        wget https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86/alpine-minirootfs-3.24.1-x86.tar.gz -O alpine.tar.gz
        sudo tar -p --same-owner -P --acls --xattrs -xzvf alpine.tar.gz -C rootfs
        cat << "EOF" | sudo tee rootfs/etc/fstab
        /dev/sda / ext4 defaults 1 1
        EOF
        cat << "EOF" | sudo tee -a rootfs/etc/inittab
        ttyS0::respawn:/sbin/agetty -a root -n -L ttyS0 115200 vt100
        ttyS1::respawn:/sbin/agetty -a root -n -L ttyS1 115200 vt100
        EOF
        cat << "EOF" | sudo tee rootfs/etc/motd
        Welcome to wSH!
        You can change this message at any time by editing /etc/motd.
        
        EOF
        wget https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v2.14.6/x86_64/apk.static
        chmod +x apk.static
        sudo ./apk.static --root rootfs --initdb --arch x86 --repository https://dl-cdn.alpinelinux.org/alpine/v3.24/main --allow-untrusted add openrc mdevd-openrc agetty vim nano wget curl bash build-base ca-certificates sudo util-linux alpine-conf e2fsprogs
        sudo ln -s /etc/init.d/mdevd rootfs/etc/runlevels/sysinit/mdevd
        sudo ln -s /etc/init.d/mdevd-init rootfs/etc/runlevels/sysinit/mdevd-init
        sudo ln -s /etc/init.d/hostname rootfs/etc/runlevels/boot/hostname
        cat << "EOF" | sudo tee rootfs/etc/local.d/startup.start
        #!/bin/sh
        /sbin/syslogd
        EOF
        sudo chmod +x rootfs/etc/local.d/startup.start
        sudo ln -s /etc/init.d/local rootfs/etc/runlevels/default/local
        #setup wifi
        cat << EOF | sudo tee rootfs/etc/network/interfaces
        auto lo
        iface lo inet loopback

        auto eth0
        iface eth0 inet dhcp
        EOF
        sudo ln -s /etc/init.d/networking rootfs/etc/runlevels/default/networking
        sudo dd if=/dev/zero of=alpine.img bs=1M count=1024
        sudo mkfs.ext4 alpine.img
        mkdir /tmp/hda-mount
        sudo mount -o loop alpine.img /tmp/hda-mount
        sudo cp -a rootfs/. /tmp/hda-mount/
        sudo umount /tmp/hda-mount
        rmdir /tmp/hda-mount
        split -b 50M alpine.img alpine.img.part.
        mkdir initramfs
        cd initramfs
        zcat ../initramfs-virt | sudo cpio -idmv
        rm ../initramfs-virt
        #sed -i 's|$MOCK mount -t tmpfs -o "$rootflags" tmpfs "$sysroot"|$MOCK mount -t ext4 -o "$rootflags" /dev/sda "$sysroot"|g' init
        #perl -pi -e 's/\$\{rootfstype:\+-t\}\s+\$\{rootfstype\}/-t ext4/g' init
        #sed -i 's|"$mountopts"|rw|g' init
        cat << EOF | sudo tee init
        #!/bin/sh

        /bin/busybox --install -s /bin

        # 1. Mount essential virtual filesystems
        mount -t proc proc /proc
        mount -t sysfs sysfs /sys
        mount -t devtmpfs devtmpfs /dev 2>/dev/null || mount -t tmpfs tmpfs /dev

        # Set basic environment PATH
        export PATH=/usr/bin:/bin:/usr/sbin:/sbin

        echo "=== Initramfs Booting ==="

        # 2. Parse kernel command line options
        for opt in $(cat /proc/cmdline); do
            case "$opt" in
                modules=*) KOPT_modules="${opt#*=}" ;;
                rootfstype=*) KOPT_rootfstype="${opt#*=}" ;;
                zfcp=*) KOPT_zfcp="${opt#*=}" ;;
                dasd=*) KOPT_dasd="${opt#*=}" ;;
                s390x_net=*) KOPT_s390x_net="${opt#*=}" ;;
                memdisk=*) KOPT_memdisk="${opt#*=}" ;;
                wireguard=*) KOPT_wireguard="${opt#*=}" ;;
                nbd=*) KOPT_nbd="${opt#*=}" ;;
                aoe=*) KOPT_aoe="${opt#*=}" ;;
            esac
        done

        echo "Loading modules..."

        # Load memdisk drivers if requested
        if [ "$KOPT_memdisk" = "yes" ]; then
            modprobe phram phram=memdisk,$(memdiskfind) 2>/dev/null 
            modprobe mtdblock 2>/dev/null 
        fi

        # Load S390x mainframe drivers if requested
        if [ -n "$KOPT_zfcp" ]; then
            modprobe zfcp 2>/dev/null 
        fi

        if [ -n "$KOPT_dasd" ]; then
            for mod in dasd_mod dasd_eckd_mod dasd_fba_mod; do 
                modprobe $mod 2>/dev/null
            done
        fi

        if [ "${KOPT_s390x_net%%,*}" = "qeth_l2" ]; then
            for mod in qeth qeth_l2 qeth_l3; do 
                modprobe $mod 2>/dev/null
            done
        fi

        # Load standard storage, filesystem, and kernel-command-line modules 
        modprobe -a $(echo "$KOPT_modules $KOPT_rootfstype" | tr ',' ' ') loop squashfs simpledrm 2>/dev/null 

        # Read and load modules listed in /etc/modules
        if [ -f /etc/modules ]; then
            sed 's/\#.*//g' < /etc/modules | while read -r module args; do 
                [ -n "$module" ] && modprobe -q $module $args
            done
        fi

        # VMware storage & CD-ROM compatibility driver workaround 
        if grep -q VMware /sys/devices/virtual/dmi/id/sys_vendor 2>/dev/null; then 
            modprobe -a ata_piix mptspi sr-mod 2>/dev/null
        fi

        # Load optional network and block device tunnel drivers
        [ -n "$KOPT_wireguard" ] && modprobe -q wireguard 2>/dev/null 
        [ -n "$KOPT_nbd" ] && modprobe -q nbd max_part=8 2>/dev/null 
        [ -n "$KOPT_aoe" ] && modprobe aoe 2>/dev/null 

        nlplug-findfs -p /bin/mdev /dev/sda

        # 3. Create target directory and mount /dev/sda as read-write (rw)
        mkdir -p /newroot

        echo "Mounting /dev/sda..."
        if ! mount -t ext4 -o rw /dev/sda /newroot; then
            echo "ERROR: Failed to mount /dev/sda in read-write mode."
            echo "Starting emergency shell..."
            exec /bin/sh
        fi

        # 4. Move virtual filesystems to the new root target
        mount -o move /proc /newroot/proc
        mount -o move /sys /newroot/sys
        mount -o move /dev /newroot/dev

        # 5. Hand over control to the main OS init
        echo "Switching root to /dev/sda..."
        if [ -x /newroot/sbin/init ]; then
            #exec switch_root /newroot /sbin/init
        elif [ -x /newroot/lib/systemd/systemd ]; then
            #exec switch_root /newroot /lib/systemd/systemd
        else
            #exec switch_root /newroot /init
        fi

        # Emergency fallback
        echo "ERROR: Unable to execute init process in /dev/sda."
        exec /bin/sh
        EOF
        cat << EOF | sudo tee -a etc/modules
        ne2k-pci
        EOF
        find . -print0 | sudo cpio --null -ov --format=newc > ../initramfs-virt

    - name: Create bundled.html
      run: |
        cd wSH
        cat << "EOF" > index.html
        <!DOCTYPE html>
        <html lang="en">
        <head>
        <meta charset="UTF-8">
        <meta
          name="viewport"
          content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="wSH">

        <title>wSH</title>

        <link rel="stylesheet" href="xterm.css">

        <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            position: fixed;
            inset: 0;
        }

        /* Extra terminal keys */
        #modifier-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 4px;

            background: #111;
            padding:
                env(safe-area-inset-top)
                4px
                4px
                4px;

            box-sizing: border-box;
            z-index: 1000;
        }

        #modifier-bar button {
            flex: 0 0 auto;

            background: #333;
            color: white;

            border: 1px solid #555;
            border-radius: 6px;

            padding: 6px 12px;

            font-family: monospace;
            font-size: 14px;

            touch-action: manipulation;
        }

        /* Terminal automatically moves below keyboard bar and follows iOS viewport */
        #terminal {
            position: fixed;
            left: 0;
            right: 0;

            top: calc(var(--vv-top, 0px) + var(--keyboard-height, 42px));
            height: calc(var(--vv-height, 100vh) - var(--keyboard-height, 42px));

            width: 100vw;
            box-sizing: border-box;

            padding:
                env(safe-area-inset-right)
                env(safe-area-inset-left)
                env(safe-area-inset-bottom)
                0;
        }

        /* Make xterm fill the terminal area */
        #terminal .xterm,
        #terminal .xterm-viewport,
        #terminal .xterm-screen {
            height: 100%;
        }

        /* Hidden VGA */
        #screen_container {
            display: none;
        }
        </style>

        <script src="xterm.js"></script>
        <script src="xterm-addon-fit.js"></script>
        <script src="libv86.js"></script>
        </head>

        <body>

        <div id="modifier-bar">
            <button data-key="SAVE">Save</button>
            <button data-key="ESC">Esc</button>
            <button data-key="CTRL">Ctrl</button>
            <button data-key="ALT">Alt</button>
            <button data-key="TAB">Tab</button>

            <button data-key="UP">↑</button>
            <button data-key="DOWN">↓</button>
            <button data-key="LEFT">←</button>
            <button data-key="RIGHT">→</button>

            <button data-key="HOME">Home</button>
            <button data-key="END">End</button>
            <button data-key="PGUP">PgUp</button>
            <button data-key="PGDN">PgDn</button>
            <button data-key="DEL">Del</button>
        </div>

        <div id="terminal"></div>
        <div id="save-overlay"
        style="
        position:fixed;
        left:0;
        top:0;
        right:0;
        bottom:0;
        display:none;
        justify-content:center;
        align-items:center;
        background:rgba(0,0,0,.45);
        backdrop-filter:blur(4px);
        z-index:100000;
        touch-action:none;
        pointer-events:all;
        user-select:none;
        ">

        <div style="
        padding:30px;
        border-radius:12px;
        background:rgba(30,30,30,.85);
        font-size:28px;
        color:white;
        font-family:sans-serif;
        ">
        Saving...
        </div>

        </div>
        <div id="screen_container"></div>

        <script>
        (async () => {

        if (navigator.storage?.persist) {
            const granted = await navigator.storage.persist();
            console.log("Persistent storage:", granted);
        }

        async function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open("wSH", 1);

                req.onupgradeneeded = () => {
                    req.result.createObjectStore("data");
                };

                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function loadSavedDisk() {
            const db = await openDB();

            const tx = db.transaction("data");
            const store = tx.objectStore("data");

            const count = await new Promise((resolve, reject) => {
                const r = store.get("disk-count");
                r.onsuccess = () => resolve(r.result ?? null);
                r.onerror = () => reject(r.error);
            });

            if (count === null) return null;

            const parts = [];

            for (let i = 0; i < count; i++) {
                const chunk = await new Promise((resolve, reject) => {
                    const r = store.get("disk-" + i);
                    r.onsuccess = () => resolve(r.result);
                    r.onerror = () => reject(r.error);
                });

                parts.push(chunk);
            }

            return await new Blob(parts).arrayBuffer();
        }

        const CHUNK_SIZE = 50 * 1024 * 1024;

        async function saveDisk() {
            const src = emulator.v86.cpu.devices.ide.primary.master.buffer.buffer;

            const db = await openDB();
            const tx = db.transaction("data", "readwrite");
            const store = tx.objectStore("data");

            const oldCount = await new Promise((resolve, reject) => {
                const r = store.get("disk-count");
                r.onsuccess = () => resolve(r.result ?? 0);
                r.onerror = () => reject(r.error);
            });

            for(let i = 0; i < oldCount; i++) {
                store.delete("disk-" + i);
            }

            const count = Math.ceil(src.byteLength / CHUNK_SIZE);

            store.put(count, "disk-count");

            for(let i = 0; i < count; i++) {
                const start = i * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, src.byteLength);

                const chunk = src.slice(start, end);

                store.put(chunk, "disk-" + i);
            }

            return new Promise((resolve, reject) => {
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error);
            });
        }

        function waitForSaveSync()
        {
            return new Promise(resolve =>
            {
                let buffer = "";

                saveWaiter = function(ch)
                {
                    buffer += ch;

                    if(buffer.includes("__SAVE_DONE__"))
                    {
                        saveWaiter = null;
                        resolve();
                    }

                    if(buffer.length > 200)
                    {
                        buffer = buffer.slice(-200);
                    }
                };
            });
        }

        async function flushFilesystem()
        {
            serial1_send("sync && echo __SAVE_DONE__\n");

            await waitForSaveSync();
        }
        
        async function loadSplitDisk(prefix, parts) {
            const blobs = [];

            for (const suffix of parts) {
                const response = await fetch(prefix + suffix);

                if (!response.ok) {
                    throw new Error(`Failed to fetch ${prefix + suffix}`);
                }

                blobs.push(await response.blob());
            }

            return await new Blob(blobs).arrayBuffer();
        }

        const count = 21; // number of parts

        const parts = Array.from(
            { length: count },
            (_, i) => {
                const first = String.fromCharCode(97 + Math.floor(i / 26));
                const second = String.fromCharCode(97 + (i % 26));
                return `${first}${second}`;
            }
        );

        let disk = await loadSavedDisk();

        if (!disk) {
            console.log("Loading base disk...");
            disk = await loadSplitDisk("alpine.img.part.", parts);
        } else {
            console.log("Loaded disk from IndexedDB.");
        }

        window.loadSavedDisk = loadSavedDisk;
        window.openDB = openDB;
        
        const term = new Terminal({
            cursorBlink: true,
            convertEol: true,
            fontFamily: "monospace",
            fontSize: 16,
            scrollback: 10000
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);

        const terminalEl = document.getElementById("terminal");
        const modifierBar = document.getElementById("modifier-bar");

        term.open(terminalEl);

        const emulator = new V86({
            wasm_path: "v86.wasm",

            memory_size: 128 * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,

            screen_container: document.getElementById("screen_container"),

            bios: {
                url: "seabios.bin"
            },

            vga_bios: {
                url: "vgabios.bin"
            },

            bzimage: {
                url: "vmlinuz-virt"
            },

            initrd: {
                url: "initramfs-virt"
            },

            hda: {
                buffer: disk
            },

            cmdline:
                "rw console=ttyS0,115200 " +
                "earlyprintk=serial,ttyS0,115200 " +
                "loglevel=7 root=/dev/sda",

            net_device: {
                type: "ne2k",
                relay_url: "wss://relay.widgetry.org/"
            },

            autostart: true,
            uart1: true
        });

        window.emulator = emulator;
        window.saveDisk = saveDisk;

        window.serial1_send = function(data) {
            const bus = emulator.v86.cpu.devices.uart1.bus.pair;

            for (const c of data) {
                bus.send("serial1-input", c.charCodeAt(0));
            }
        };

        const saveOverlay = document.getElementById("save-overlay");

        function showSaveOverlay() {
            saveOverlay.style.display = "flex";
        }

        function hideSaveOverlay() {
            saveOverlay.style.display = "none";
        }

        /* Main terminal output (ttyS0) */
        emulator.add_listener("serial0-output-byte", function(b) {
            term.write(String.fromCharCode(b));
        });


        /* Save/control serial output (ttyS1) */
        emulator.add_listener("serial1-output-byte", function(b) {
            console.log("SERIAL1:", String.fromCharCode(b));
        });

        let saveWaiter = null;

        emulator.add_listener("serial1-output-byte", function(b) {

            const c = String.fromCharCode(b);

            if(saveWaiter)
            {
                saveWaiter(c);
            }

        });

        let ctrlHeld = false;
        let altHeld = false;
        let saveInProgress = false;

        /* Extra buttons */
        document.querySelectorAll("#modifier-bar button").forEach(button => {
            button.addEventListener("click", () => {
                const key = button.dataset.key;

                switch (key) {
                    case "SAVE":

                        (async () => {

                            // ADD THESE LINES HERE
                            if (saveInProgress)
                                return;

                            saveInProgress = true;

                            button.disabled = true;

                            showSaveOverlay();

                            try {
                                button.textContent = "Syncing...";

                                await flushFilesystem();
                                await new Promise(r => setTimeout(r, 100));

                                button.textContent = "Saving...";

                                emulator.stop();

                                try {
                                    await saveDisk();
                                } finally {
                                    emulator.run();
                                }

                                button.textContent = "Saved!";
                            }
                            catch (e) {
                                console.error(e);
                                button.textContent = "Failed";
                            }
                            finally {
                                // ALSO MOVE THIS HERE
                                saveInProgress = false;

                                hideSaveOverlay();

                                setTimeout(() => {
                                    button.disabled = false;
                                    button.textContent = "Save";
                                }, 1000);
                            }

                        })();

                        break;
                        
                    case "ESC":
                        emulator.serial0_send("\x1b");
                        break;

                    case "TAB":
                        emulator.serial0_send("\t");
                        break;

                    case "CTRL":
                        ctrlHeld = !ctrlHeld;
                        button.style.background = ctrlHeld ? "#666" : "#333";
                        break;

                    case "ALT":
                        altHeld = !altHeld;
                        button.style.background = altHeld ? "#666" : "#333";
                        break;

                    case "UP":
                        emulator.serial0_send("\x1b[A");
                        break;

                    case "DOWN":
                        emulator.serial0_send("\x1b[B");
                        break;

                    case "LEFT":
                        emulator.serial0_send("\x1b[D");
                        break;

                    case "RIGHT":
                        emulator.serial0_send("\x1b[C");
                        break;

                    case "HOME":
                        emulator.serial0_send("\x1b[H");
                        break;

                    case "END":
                        emulator.serial0_send("\x1b[F");
                        break;

                    case "PGUP":
                        emulator.serial0_send("\x1b[5~");
                        break;

                    case "PGDN":
                        emulator.serial0_send("\x1b[6~");
                        break;

                    case "DEL":
                        emulator.serial0_send("\x1b[3~");
                        break;
                }

                term.focus();
            });
        });

        /* Normal typing + modifiers */
        term.onData(function(data) {
            if (ctrlHeld && data.length === 1) {
                ctrlHeld = false;
                document.querySelector('[data-key="CTRL"]').style.background = "#333";

                const code = data.toUpperCase().charCodeAt(0);
                emulator.serial0_send(String.fromCharCode(code & 0x1f));
                return;
            }

            if (altHeld) {
                altHeld = false;
                document.querySelector('[data-key="ALT"]').style.background = "#333";
                emulator.serial0_send("\x1b" + data);
                return;
            }

            emulator.serial0_send(data);
        });

        /* Track the actual visible iOS viewport */
        function syncViewport() {
            const vv = window.visualViewport;
            const top = vv ? vv.offsetTop : 0;
            const height = vv ? vv.height : window.innerHeight;

            document.documentElement.style.setProperty("--vv-top", top + "px");
            document.documentElement.style.setProperty("--vv-height", height + "px");

            fitAddon.fit();
        }

        /* Track modifier bar wrapping height */
        function syncKeyboardHeight() {
            document.documentElement.style.setProperty(
                "--keyboard-height",
                modifierBar.offsetHeight + "px"
            );

            fitAddon.fit();
        }

        const barObserver = new ResizeObserver(() => {
            syncKeyboardHeight();
            syncViewport();
        });
        barObserver.observe(modifierBar);

        if (window.visualViewport) {
            visualViewport.addEventListener("resize", syncViewport);
            visualViewport.addEventListener("scroll", syncViewport);
        }

        window.addEventListener("resize", () => {
            syncKeyboardHeight();
            syncViewport();
        });

        window.addEventListener("orientationchange", () => {
            setTimeout(() => {
                syncKeyboardHeight();
                syncViewport();
            }, 100);
        });

        window.addEventListener("focus", () => {
            term.focus();
        });

        syncKeyboardHeight();
        syncViewport();
        term.focus();

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js");
        }
        })();
        </script>

        </body>
        </html>
        EOF

    - name: Create Service Worker
      run: |
        cd wSH
        cat << "EOF" > sw.js
        const CACHE = "v86-offline-v1";

        const FILES = [
            "./",
            "./index.html",

            "./libv86.js",
            "./v86.wasm",

            "./seabios.bin",
            "./vgabios.bin",

            "./vmlinuz-virt",
            "./initramfs-virt",

            "./xterm.js",
            "./xterm.css",
            "./xterm-addon-fit.js"
        ];

        self.addEventListener("install", event => {
            event.waitUntil(
                caches.open(CACHE).then(cache => cache.addAll(FILES))
            );
            self.skipWaiting();
        });

        self.addEventListener("activate", event => {
            event.waitUntil(clients.claim());
        });

        self.addEventListener("fetch", event => {
            event.respondWith(
                caches.match(event.request).then(response => {
                    return response || fetch(event.request);
                })
            );
        });
        EOF

