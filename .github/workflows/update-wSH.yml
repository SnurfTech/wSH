name: Update wSH
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create Build Folder and Set Up Dependencies
      run: |
        mkdir wSH
        cd wSH
        wget https://github.com/copy/v86/releases/download/latest/libv86.js
        wget https://github.com/copy/v86/releases/download/latest/v86.wasm
        wget https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js
        wget https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js
        wget https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css
        wget https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86/alpine-virt-3.24.1-x86.iso -O alpine.iso
        wget https://github.com/copy/v86/raw/refs/heads/master/bios/vgabios.bin
        sudo apt install p7zip -y
        7z x alpine.iso
        mv boot/vmlinuz-virt .
        mv boot/initramfs-virt .
        git clone https://github.com/qemu/seabios
        cd seabios
        make defconfig
        cat << EOF >> .config
        # Option A: Debug Logging Configuration
        CONFIG_DEBUG_LEVEL=8
        CONFIG_DEBUG_SERIAL=y
        CONFIG_DEBUG_SERIAL_PORT=0x3f8

        # Option B: Interactive Serial Console (Sercon)
        CONFIG_SERCON=y
        EOF
        make olddefconfig
        make -j$(nproc)
        mv out/bios.bin ../seabios.bin
        cd ..
        mkdir rootfs
        #cd rootfs
        #zcat ../initramfs-virt | sudo cpio -idmv
        #cd ..
        #for i in apks/x86/*.apk; do sudo tar -p --same-owner -P --acls --xattrs -xvf $i -C rootfs; done
        wget https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86/alpine-minirootfs-3.24.1-x86.tar.gz -O alpine.tar.gz
        sudo tar -p --same-owner -P --acls --xattrs -xzvf alpine.tar.gz -C rootfs
        cat << "EOF" | sudo tee rootfs/etc/fstab
        /dev/sda / ext4 defaults 1 1
        EOF
        cat << "EOF" | sudo tee -a rootfs/etc/inittab
        ttyS0::respawn:/sbin/getty -L 115200 ttyS0 vt100
        EOF
        sudo sed -i 's|^root.*|root::14847:0:99999:7:::|g' rootfs/etc/shadow
        #sudo ln -s /sbin/openrc rootfs/sbin/init
        sudo dd if=/dev/zero of=alpine.img bs=1M count=100
        sudo mkfs.ext4 alpine.img
        mkdir /tmp/hda-mount
        sudo mount -o loop alpine.img /tmp/hda-mount
        sudo cp -a rootfs/. /tmp/hda-mount/
        sudo umount /tmp/hda-mount
        rmdir /tmp/hda-mount
        mkdir initramfs
        cd initramfs
        zcat ../initramfs-virt | sudo cpio -idmv
        rm ../initramfs-virt
        #sed -i 's|$MOCK mount -t tmpfs -o "$rootflags" tmpfs "$sysroot"|$MOCK mount -t ext4 -o "$rootflags" /dev/sda "$sysroot"|g' init
        perl -pi -e 's/\$\{rootfstype:\+-t\}\s+\$\{rootfstype\}/-t ext4/g' init
        sed -i 's|"$mountopts"|rw|g' init
        find . -print0 | sudo cpio --null -ov --format=newc > ../initramfs-virt

    - name: Create bundled.html
      run: |
        cd wSH
        cat << "EOF" > index.html
        <!DOCTYPE html>
        <html lang="en">
        <head>
        <meta charset="UTF-8">
        <meta
          name="viewport"
          content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="wSH">

        <title>wSH</title>

        <link rel="stylesheet" href="xterm.css">

        <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            position: fixed;
            inset: 0;
        }

        /* Extra terminal keys */
        #modifier-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 4px;

            background: #111;
            padding:
                env(safe-area-inset-top)
                4px
                4px
                4px;

            box-sizing: border-box;
            z-index: 1000;
        }

        #modifier-bar button {
            flex: 0 0 auto;

            background: #333;
            color: white;

            border: 1px solid #555;
            border-radius: 6px;

            padding: 6px 12px;

            font-family: monospace;
            font-size: 14px;

            touch-action: manipulation;
        }

        /* Terminal automatically moves below keyboard bar and follows iOS viewport */
        #terminal {
            position: fixed;
            left: 0;
            right: 0;

            top: calc(var(--vv-top, 0px) + var(--keyboard-height, 42px));
            height: calc(var(--vv-height, 100vh) - var(--keyboard-height, 42px));

            width: 100vw;
            box-sizing: border-box;

            padding:
                env(safe-area-inset-right)
                env(safe-area-inset-left)
                env(safe-area-inset-bottom)
                0;
        }

        /* Make xterm fill the terminal area */
        #terminal .xterm,
        #terminal .xterm-viewport,
        #terminal .xterm-screen {
            height: 100%;
        }

        /* Hidden VGA */
        #screen_container {
            display: none;
        }
        </style>

        <script src="xterm.js"></script>
        <script src="xterm-addon-fit.js"></script>
        <script src="libv86.js"></script>
        </head>

        <body>

        <div id="modifier-bar">
            <button data-key="ESC">Esc</button>
            <button data-key="CTRL">Ctrl</button>
            <button data-key="ALT">Alt</button>
            <button data-key="TAB">Tab</button>

            <button data-key="UP">↑</button>
            <button data-key="DOWN">↓</button>
            <button data-key="LEFT">←</button>
            <button data-key="RIGHT">→</button>

            <button data-key="HOME">Home</button>
            <button data-key="END">End</button>
            <button data-key="PGUP">PgUp</button>
            <button data-key="PGDN">PgDn</button>
            <button data-key="DEL">Del</button>
        </div>

        <div id="terminal"></div>
        <div id="screen_container"></div>

        <script>
        const term = new Terminal({
            cursorBlink: true,
            convertEol: true,
            fontFamily: "monospace",
            fontSize: 16,
            scrollback: 10000
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);

        const terminalEl = document.getElementById("terminal");
        const modifierBar = document.getElementById("modifier-bar");

        term.open(terminalEl);

        const emulator = new V86({
            wasm_path: "v86.wasm",

            memory_size: 128 * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,

            screen_container: document.getElementById("screen_container"),

            bios: {
                url: "seabios.bin"
            },

            vga_bios: {
                url: "vgabios.bin"
            },

            bzimage: {
                url: "vmlinuz-virt"
            },

            initrd: {
                url: "initramfs-virt"
            },

            hda: {
                url: "alpine.img"
            },

            cmdline:
                "rw console=ttyS0,115200 " +
                "earlyprintk=serial,ttyS0,115200 " +
                "loglevel=7 root=/dev/sda",

            net_device: {
                type: "ne2k",
                relay_url: "wss://relay.widgetry.org/"
            },

            autostart: true
        });

        /* Serial output */
        emulator.add_listener("serial0-output-byte", function(b) {
            term.write(String.fromCharCode(b));
        });

        let ctrlHeld = false;
        let altHeld = false;

        /* Extra buttons */
        document.querySelectorAll("#modifier-bar button").forEach(button => {
            button.addEventListener("click", () => {
                const key = button.dataset.key;

                switch (key) {
                    case "ESC":
                        emulator.serial0_send("\x1b");
                        break;

                    case "TAB":
                        emulator.serial0_send("\t");
                        break;

                    case "CTRL":
                        ctrlHeld = !ctrlHeld;
                        button.style.background = ctrlHeld ? "#666" : "#333";
                        break;

                    case "ALT":
                        altHeld = !altHeld;
                        button.style.background = altHeld ? "#666" : "#333";
                        break;

                    case "UP":
                        emulator.serial0_send("\x1b[A");
                        break;

                    case "DOWN":
                        emulator.serial0_send("\x1b[B");
                        break;

                    case "LEFT":
                        emulator.serial0_send("\x1b[D");
                        break;

                    case "RIGHT":
                        emulator.serial0_send("\x1b[C");
                        break;

                    case "HOME":
                        emulator.serial0_send("\x1b[H");
                        break;

                    case "END":
                        emulator.serial0_send("\x1b[F");
                        break;

                    case "PGUP":
                        emulator.serial0_send("\x1b[5~");
                        break;

                    case "PGDN":
                        emulator.serial0_send("\x1b[6~");
                        break;

                    case "DEL":
                        emulator.serial0_send("\x1b[3~");
                        break;
                }

                term.focus();
            });
        });

        /* Normal typing + modifiers */
        term.onData(function(data) {
            if (ctrlHeld && data.length === 1) {
                ctrlHeld = false;
                document.querySelector('[data-key="CTRL"]').style.background = "#333";

                const code = data.toUpperCase().charCodeAt(0);
                emulator.serial0_send(String.fromCharCode(code & 0x1f));
                return;
            }

            if (altHeld) {
                altHeld = false;
                document.querySelector('[data-key="ALT"]').style.background = "#333";
                emulator.serial0_send("\x1b" + data);
                return;
            }

            emulator.serial0_send(data);
        });

        /* Track the actual visible iOS viewport */
        function syncViewport() {
            const vv = window.visualViewport;
            const top = vv ? vv.offsetTop : 0;
            const height = vv ? vv.height : window.innerHeight;

            document.documentElement.style.setProperty("--vv-top", top + "px");
            document.documentElement.style.setProperty("--vv-height", height + "px");

            fitAddon.fit();
        }

        /* Track modifier bar wrapping height */
        function syncKeyboardHeight() {
            document.documentElement.style.setProperty(
                "--keyboard-height",
                modifierBar.offsetHeight + "px"
            );

            fitAddon.fit();
        }

        const barObserver = new ResizeObserver(() => {
            syncKeyboardHeight();
            syncViewport();
        });
        barObserver.observe(modifierBar);

        if (window.visualViewport) {
            visualViewport.addEventListener("resize", syncViewport);
            visualViewport.addEventListener("scroll", syncViewport);
        }

        window.addEventListener("resize", () => {
            syncKeyboardHeight();
            syncViewport();
        });

        window.addEventListener("orientationchange", () => {
            setTimeout(() => {
                syncKeyboardHeight();
                syncViewport();
            }, 100);
        });

        window.addEventListener("focus", () => {
            term.focus();
        });

        syncKeyboardHeight();
        syncViewport();
        term.focus();

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js");
        }
        </script>

        </body>
        </html>
        EOF

    - name: Create Service Worker
      run: |
        cd wSH
        cat << "EOF" > sw.js
        const CACHE = "v86-offline-v1";

        const FILES = [
            "./",
            "./index.html",

            "./libv86.js",
            "./v86.wasm",

            "./seabios.bin",
            "./vgabios.bin",

            "./vmlinuz-virt",
            "./initramfs-virt",
            "./alpine.img",

            "./xterm.js",
            "./xterm.css",
            "./xterm-addon-fit.js"
        ];

        self.addEventListener("install", event => {
            event.waitUntil(
                caches.open(CACHE).then(cache => cache.addAll(FILES))
            );
            self.skipWaiting();
        });

        self.addEventListener("activate", event => {
            event.waitUntil(clients.claim());
        });

        self.addEventListener("fetch", event => {
            event.respondWith(
                caches.match(event.request).then(response => {
                    return response || fetch(event.request);
                })
            );
        });
        EOF

    - name: Bundle & Patch bundled.html
      run: |
        #cd wSH
        #perl -MMIME::Base64 -i -pe 'BEGIN { $file = "libv86.js"; $mime = "text/javascript"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html
        #perl -MMIME::Base64 -i -pe 'BEGIN { $file = "v86.wasm"; $mime = "application/wasm"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html
        #perl -MMIME::Base64 -i -pe 'BEGIN { $file = "seabios.bin"; $mime = "application/octet-stream"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html
        #perl -MMIME::Base64 -i -pe 'BEGIN { $file = "vgabios.bin"; $mime = "application/octet-stream"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html
        #perl -MMIME::Base64 -i -pe 'BEGIN { $file = "xterm.js"; $mime = "text/javascript"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html
        #perl -MMIME::Base64 -i -pe 'BEGIN { $file = "xterm.css"; $mime = "text/css"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html
        #perl -MMIME::Base64 -i -pe 'BEGIN { $file = "xterm-addon-fit.js"; $mime = "text/javascript"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html
        #perl -MMIME::Base64 -i -pe 'BEGIN { $file = "alpine.img"; $mime = "application/octet-stream"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html
        #perl -MMIME::Base64 -i -pe 'BEGIN { $file = "vmlinuz-virt"; $mime = "application/octet-stream"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html
        #perl -MMIME::Base64 -i -pe 'BEGIN { $file = "initramfs-virt"; $mime = "application/octet-stream"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html

    - name: Replace Old index.html File
      run: |
        #[[ -f server/index.html ]] && rm server/index.html
        #mv wSH/bundled.html server/index.html
        rm -r server
        mkdir server
        mv wSH/index.html server/
        mv wSH/*.js server/
        mv wSH/*.bin server/
        mv wSH/*-virt server/
        mv wSH/alpine.img server/
        mv wSH/xterm.css server/
        mv wSH/v86.wasm server/

    - name: Update Icon Data
      run: |
        python -c "import base64,re; d=base64.b64encode(open('assets/appicon.png','rb').read()).decode(); f='unsigned.mobileconfig'; s=open(f,'r',encoding='utf-8').read(); s=re.sub(r'      <data>.*</data>', f'      <data>{d}</data>', s); open(f,'w',encoding='utf-8').write(s)"

    # 4. Commit and overwrite the root file
    - name: Commit
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add unsigned.mobileconfig
        #git add server/index.html
        git add server
        git commit -m "Automated update: Updated unsigned Mobileconfig and wSH HTML" || echo "No changes to commit"
        git push
