name: Update Flappybird
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create Build Folder and Download Dependencies
      run: |
        mkdir wSH
        cd wSH
        wget https://github.com/copy/v86/releases/download/latest/libv86.js
        wget https://github.com/copy/v86/releases/download/latest/v86.wasm
        wget https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js
        wget https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js
        wget https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css
        wget https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86/alpine-virt-3.24.1-x86.iso -O alpine.iso
        wget https://github.com/copy/v86/raw/refs/heads/master/bios/seabios.bin
        wget https://github.com/copy/v86/raw/refs/heads/master/bios/vgabios.bin

    - name: Create bundled.html
      run: |
        cd wSH
        cat << EOF > bundled.html
                <!DOCTYPE html>
                <html lang="en">
                <head>
                  <meta charset="UTF-8" />
                  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
                  <meta name="apple-mobile-web-app-capable" content="yes" />
                  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
                  <meta name="apple-mobile-web-app-title" content="wSH" />
                  <title>wSH Terminal</title>

                  <link rel="stylesheet" href="xterm.css" />
                  <script src="libv86.js"></script>
                  <script src="xterm.js"></script>
                  <script src="xterm-addon-fit.js"></script>

                  <style>
                    html, body {
                      margin: 0;
                      padding: 0;
                      width: 100%;
                      height: 100%;
                      overflow: hidden;
                      background: #000;
                    }

                    body {
                      position: fixed;
                      inset: 0;
                    }

                    #vga_container,
                    #term_container {
                      position: fixed;
                      inset: 0;
                      width: 100vw;
                      height: 100dvh;
                      background: #000;
                    }

                    #vga_container {
                      display: block;
                    }

                    #term_container {
                      display: none;
                    }

                    /* Let v86's canvas fill the viewport without changing aspect ratio too aggressively */
                    #vga_container canvas {
                      display: block;
                      width: auto !important;
                      height: auto !important;
                      max-width: 100vw;
                      max-height: 100dvh;
                    }

                    /* xterm should fill its wrapper */
                    #term_container .xterm,
                    #term_container .xterm-viewport,
                    #term_container .xterm-screen {
                      height: 100% !important;
                      width: 100% !important;
                    }
                  </style>
                </head>
                <body>
                  <div id="vga_container"></div>
                  <div id="term_container"></div>

                  <script>
                    const vgaContainer = document.getElementById("vga_container");
                    const termContainer = document.getElementById("term_container");

                    const terminal = new Terminal({
                      convertEol: true,
                      cursorBlink: true,
                      fontSize: 16,
                      fontFamily: "monospace",
                      scrollback: 1000,
                      disableStdin: false
                    });

                    const fitAddon = new FitAddon.FitAddon();
                    terminal.loadAddon(fitAddon);
                    terminal.open(termContainer);

                    let switchedToTerminal = false;
                    let serialLineBuffer = "";

                    function fitTerminal() {
                      try {
                        fitAddon.fit();
                      } catch (_) {}
                    }

                    function showTerminal() {
                      if (switchedToTerminal) return;
                      switchedToTerminal = true;

                      vgaContainer.style.display = "none";
                      termContainer.style.display = "block";

                      requestAnimationFrame(() => {
                        fitTerminal();
                        terminal.focus();
                      });
                    }

                    function shouldIgnoreLine(line) {
                      const cleaned = line.replace(/\r/g, "").trim();

                      if (!cleaned) return true;

                      // Ignore ISOLINUX banner regardless of version number.
                      if (/^ISOLINUX\b.*Copyright.*$/i.test(cleaned)) return true;

                      // Ignore the boot prompt line.
                      if (/^boot:\s*$/i.test(cleaned)) return true;

                      return false;
                    }

                    function handleSerialLine(line) {
                      const cleaned = line.replace(/\r/g, "");

                      if (shouldIgnoreLine(cleaned)) return;

                      showTerminal();
                      terminal.write(cleaned + "\r\n");
                    }

                    const emulator = new V86({
                      wasm_path: "v86.wasm",
                      memory_size: 128 * 1024 * 1024,
                      vga_memory_size: 8 * 1024 * 1024,
                      screen_container: vgaContainer,
                      bios: { url: "seabios.bin" },
                      vga_bios: { url: "vgabios.bin" },
                      cdrom: { url: "alpine.iso" },
                      autostart: true
                    });

                    emulator.add_listener("serial0-output-byte", function(byte) {
                      const ch = String.fromCharCode(byte);

                      if (ch === "\r") {
                        return;
                      }

                      if (ch === "\n") {
                        handleSerialLine(serialLineBuffer);
                        serialLineBuffer = "";
                        return;
                      }

                      serialLineBuffer += ch;
                    });

                    terminal.onData(function(data) {
                      emulator.serial0_send(data);
                    });

                    window.addEventListener("resize", function() {
                      if (switchedToTerminal) fitTerminal();
                    });

                    window.addEventListener("orientationchange", function() {
                      if (switchedToTerminal) {
                        setTimeout(fitTerminal, 50);
                      }
                    });
                  </script>
                </body>
                </html>
        EOF

    - name: Bundle & Patch bundled.html
      run: |
        cd wSH
        perl -MMIME::Base64 -i -pe 'BEGIN { $file = "libv86.js"; $mime = "text/javascript"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html
        perl -MMIME::Base64 -i -pe 'BEGIN { $file = "v86.wasm"; $mime = "application/wasm"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html
        perl -MMIME::Base64 -i -pe 'BEGIN { $file = "seabios.bin"; $mime = "application/octet-stream"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html
        perl -MMIME::Base64 -i -pe 'BEGIN { $file = "vgabios.bin"; $mime = "application/octet-stream"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html
        perl -MMIME::Base64 -i -pe 'BEGIN { $file = "xterm.js"; $mime = "text/javascript"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html
        perl -MMIME::Base64 -i -pe 'BEGIN { $file = "xterm.css"; $mime = "text/css"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html
        perl -MMIME::Base64 -i -pe 'BEGIN { $file = "xterm-addon-fit.js"; $mime = "text/javascript"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html
        perl -MMIME::Base64 -i -pe 'BEGIN { $file = "alpine.iso"; $mime = "application/octet-stream"; open my $fh, "<:raw", $file or die "Missing $file: $!"; local $/; $b64 = encode_base64(<$fh>, ""); $uri = "data:$mime;base64,$b64"; } s/\b\Q$file\E\b/$uri/g' bundled.html

    - name: Replace Old index.html File
      run: |
        [[ -f server/index.html ]] && rm server/index.html
        mv wSH/bundled.html server/index.html

    - name: Update Icon Data
      run: |
        python -c "import base64,re; d=base64.b64encode(open('assets/appicon.png','rb').read()).decode(); f='unsigned.mobileconfig'; s=open(f,'r',encoding='utf-8').read(); s=re.sub(r'      <data>.*</data>', f'      <data>{d}</data>', s); open(f,'w',encoding='utf-8').write(s)"

    # 4. Commit and overwrite the root file
    - name: Commit
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add unsigned.mobileconfig
        git add server/index.html
        git commit -m "Automated update: Updated unsigned Mobileconfig and wSH HTML" || echo "No changes to commit"
        git push
